<!DOCTYPE html>
<html lang="es-CL" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark"
		th:fragment="navbar">
		<div class="container">
			<!-- Nombre de la aplicación (Cambiado de Biblio a EduManager) -->
			<a class="navbar-brand d-flex align-items-center" th:href="@{/}">
				<img th:src="@{/img/logo.svg}" alt="Logo EduManager" class="me-2 logo-img" style="width: 30px; height: 30px;"> 
				<strong>EduManager</strong>
			</a>

			<!-- Botón responsive -->
			<button class="navbar-toggler" type="button"
				data-bs-toggle="collapse" data-bs-target="#navbarEduManager"
				aria-controls="navbarEduManager" aria-expanded="false"
				aria-label="Mostrar navegación">
				<span class="navbar-toggler-icon"></span>
			</button>

			<!-- Menú -->
			<div class="collapse navbar-collapse" id="navbarEduManager">
				<!-- Menú principal -->
				<ul class="navbar-nav me-auto mb-2 mb-lg-0">
					<!-- Inicio -->
					<li class="nav-item">
						<a class="nav-link" th:href="@{/}">Home</a>
					</li>
					
					<!-- Alumnos: Reemplaza a Libros y Autores (Visible solo para usuarios autenticados) -->
					<li class="nav-item" sec:authorize="isAuthenticated()">
						<a class="nav-link" th:href="@{/alumnos}">Alumnos</a>
					</li>

					<!-- Administración: Acceso restringido solo para ADMIN -->
					<li class="nav-item" sec:authorize="hasRole('ADMIN')">
						<a class="nav-link" th:href="@{/admin}">Administración</a>
					</li>
				</ul>

				<!-- USUARIO NO AUTENTICADO [2] -->
				<div sec:authorize="isAnonymous()">
					<a th:href="@{/login}" class="btn btn-outline-light me-2">Ingresar</a> 
					<a th:href="@{/registro}" class="btn btn-primary">Registrarse</a>
				</div>

				<!-- USUARIO AUTENTICADO [2] -->
				<div sec:authorize="isAuthenticated()" class="d-flex align-items-center">
					<!-- Nombre de Usuario -->
					<span class="text-white me-3"> 
						Bienvenido, <strong sec:authentication="name"></strong>
					</span>
					<!-- Badge Rol ADMIN [2] -->
					<span sec:authorize="hasRole('ADMIN')" class="badge bg-danger me-3">ADMIN</span>
					<!-- Badge Rol USER [2] -->
					<span sec:authorize="hasRole('USER')" class="badge bg-primary me-3">USER</span>

					<!-- Botón de Cerrar Sesión -->
					<form th:action="@{/logout}" method="post" class="d-inline">
						<button type="submit" class="btn btn-outline-light">Cerrar sesión</button>
					</form>
				</div>
			</div>
		</div>
	</nav>
</body>

</html>
