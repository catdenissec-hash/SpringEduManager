<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Alumnos - SpringEduManager</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="bg-light">

    <!-- Fragmento de Navegación -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>🎓 Lista de Estudiantes</h2>
            
            <!-- Botón disponible solo para ADMINISTRADORES -->
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/alumnos/nuevo}" class="btn btn-primary">
                + Nuevo Alumno
            </a>
        </div>

        <!-- Formulario de Búsqueda -->
		<form th:action="@{/alumnos}" method="get" class="row g-2 mb-4">
  		 <div class="col-md-8">
       	 <input type="text" 
               name="buscar" 
               th:value="${buscar}" 
               class="form-control" 
               placeholder="Buscar por RUT, Nombre, Apellido o Curso...">
   		 </div>
    	<div class="col-md-2 d-grid">
        <button type="submit" class="btn btn-primary">🔍 Buscar</button>
    	</div>
   		 <div class="col-md-2 d-grid">
        <a th:href="@{/alumnos}" class="btn btn-secondary">🔍 Limpiar</a>
   	 </div>
	</form>

        <!-- Mensaje de alerta si la lista está vacía -->
        <div th:if="${#lists.isEmpty(alumnos)}" class="alert alert-info text-center" role="alert">
            No se encontraron estudiantes registrados en el sistema.
        </div>

        <!-- Tabla de Alumnos -->
        <div th:if="${not #lists.isEmpty(alumnos)}" class="table-responsive shadow-sm bg-white rounded">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>RUT</th>
                        <th>Nombre Completo</th>
                        <th>Email</th>
                        <th>Curso</th>
                        <th>Práctica</th>
                        <th>Promedio</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="alumno : ${alumnos}">
                    	<td th:text="${alumno.id}">1</td>
                        <td th:text="${alumno.rut}">12345678-9</td>
                        <td th:text="${alumno.nombre + ' ' + alumno.apellido}">Juan Pérez</td>
                        <td th:text="${alumno.email}">juan.perez@email.com</td>
                        <td><span class="badge bg-info text-dark" th:text="${alumno.curso}">Java M6</span></td>
                        <td>
                            <span th:text="${alumno.estadoPractica}"
                                  th:classappend="${alumno.estadoPractica == 'Aprobada' ? 'badge bg-success' : (alumno.estadoPractica == 'En Curso' ? 'badge bg-warning text-dark' : 'badge bg-secondary')}">
                                Pendiente
                            </span>
                        </td>
                        <td th:text="${alumno.promedioEvaluaciones}">6.5</td>
                        <td class="text-center">
                            <div class="btn-group btn-group-sm" role="group">
                                <!-- Ver detalle (ADMIN y USER) -->
                                <a th:href="@{/alumnos/ver/{id}(id=${alumno.id})}" class="btn btn-outline-info">Ver</a>
                                
                                <!-- Editar (Solo ADMIN) -->
                                <a sec:authorize="hasRole('ADMIN')" th:href="@{/alumnos/editar/{id}(id=${alumno.id})}" class="btn btn-outline-warning">Editar</a>
                                
                                <!-- Eliminar (Solo ADMIN) -->
                                <button type="button" 
       							 class="btn btn-outline-danger btn-sm btn-eliminar-alumno"
       							th:data-id="${alumno.id}"
        						th:data-nombre="${alumno.nombre + ' ' + alumno.apellido}">
    							🗑️ Eliminar
								</button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
	
	<!-- Formulario oculto para eliminar con CSRF -->
	<form id="formEliminarAlumno" method="post" style="display: none;">
    <input type="hidden" name="_csrf" th:value="${_csrf.token}">
</form>
<!-- 2. Script de SweetAlert2 (Obligatorio antes de app.js) -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<!-- JS Personalizado -->
<script th:src="@{/js/app.js}"></script>
</body>
</html>
