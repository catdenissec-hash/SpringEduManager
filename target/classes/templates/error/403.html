<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>403 - Acceso Denegado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
    <div class="container text-center py-5">
        <div class="card shadow border-0 mx-auto" style="max-width: 500px;">
            <div class="card-body p-5">
                <h1 class="display-1 fw-bold text-danger">403</h1>
                <h3 class="mb-3 fw-bold">Acceso Denegado</h3>
                <p class="text-muted mb-4">
                    No tienes los permisos necesarios para acceder a esta función. Se requiere perfil de <strong>Administrador</strong>.
                </p>
                <a th:href="@{/}" class="btn btn-primary">🏠 Volver al Inicio</a>
            </div>
        </div>
    </div>
</body>
</html>
